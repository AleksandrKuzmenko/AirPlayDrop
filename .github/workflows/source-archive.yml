name: Source archive
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: sudo xcode-select --switch /Applications/Xcode_15.4.app
      - name: Verify tagged source
        run: ./scripts/verify.sh
      - name: Create immutable source archive
        id: archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="AirPlayDrop-${version}-source.tar.gz"
          git archive --format=tar.gz --prefix="AirPlayDrop-${version}/" --output="$archive" "$GITHUB_SHA"
          shasum -a 256 "$archive" > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AirPlayDrop-source
          path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.archive }}.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.archive.outputs.archive }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease
