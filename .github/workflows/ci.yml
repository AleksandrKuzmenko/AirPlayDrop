name: CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub retired the macos-14 image. The oldest Xcode installed on
          # macos-15 stands in for the oldest supported toolchain.
          - runner: macos-15
            xcode: oldest
          - runner: macos-15
            xcode: default
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select oldest installed Xcode
        if: matrix.xcode == 'oldest'
        run: |
          oldest=$(ls -d /Applications/Xcode_*.app | sort -V | head -n 1)
          echo "Selecting $oldest"
          sudo xcode-select --switch "$oldest"
      - name: Toolchain
        run: xcodebuild -version
      - name: Verify
        run: ./scripts/verify.sh

  ffmpeg-integration:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Run generated-media integration test
        run: |
          xcodebuild \
            -project AirPlayDrop/AirPlayDrop.xcodeproj \
            -scheme AirPlayDrop \
            -destination "platform=macOS,arch=$(uname -m)" \
            -only-testing:AirPlayDropTests/AirPlayDropTests/testGeneratedMediaPreparationAndCacheValidation \
            test CODE_SIGNING_ALLOWED=NO
